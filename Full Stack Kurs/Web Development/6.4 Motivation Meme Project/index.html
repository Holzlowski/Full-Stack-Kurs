<!-- 
  TODO: Create a motivational post website.
Style it how ever you like. 
Look at the goal image for inspiration.
But it must have the following features:
1. The main h1 text should be using the Regular Libre Baskerville Font from Google Fonts:
  https://fonts.google.com/specimen/Libre+Baskerville
2. The text should be white and background black.
3. Add your own image into the images folder inside assets. It should have a 5px white border.
4. The text should be center aligned.
5. Create a div to contain the h1, p and img elements. Adjust the margins so that the image and text are centered on the page. 
  Hint: You horizontally center a div by giving it a width of 50% and a margin-left of 25%.
  Hint: Set the image to have a width of 100% so it fills the div. 
6. Read about the text-transform property on MDN docs to make the h1 uppercase with CSS.
  https://developer.mozilla.org/en-US/docs/Web/CSS/text-transform 
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Motivation Meme Project</title>
  <link href="style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playwrite+AU+QLD:wght@100..400&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: black;
    }
    h1 {
      text-transform: uppercase;
      font-size: 3em;
    }

    .meme-container {
      width: 50%;
      margin-top: 40px;
      margin-left: 25%;
      margin-right: 25%;
      color: white;
      font-family: 'Libre Baskerville', serif;
      text-align: center;
    }
    .meme-image {
      border: solid white 5px;
      width:100%;
    }
  </style>
</head>

<body>
  <div class="meme-container">
    <img class="meme-image" src="./assets/images/daenerys.jpeg" alt="Daenerys Targaryen";>
    <h1>Dieser Moment</h1>
    <p>Wenn du die perfekte Avocado findest</p>
  </div>
</body>

</html>
