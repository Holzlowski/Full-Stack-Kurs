<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    /* Der rote Kreis wird nicht in die Mitte gesetzt, weil von der linken oberen Ecke ausgegangen wird */
    .red-circle {
      background-color: red;
      border-radius: 50%;
      width: 200px;
      height: 200px;
      position: absolute;
      top: 150px;
      left: 250px;
    }

    .blue-box {
      background-color: blue; /* Der Hintergrund wird auch ohne Höhe und Breite angezeigt, weil das Child-Element Höhe und Breite besitzt */
      width: 500px;
      height: 300px;
      top: 200px;
      left: 200px;
      position: relative;
    }

  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
